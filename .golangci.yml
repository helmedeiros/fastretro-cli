version: "2"
linters:
  enable:
    - misspell
    - revive
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
        path: internal/tui/
        text: ClaimIdentity|SendState|Send|SaveTeam|SaveHistory|Save|SetSelectedTeamID|RequestState
      - linters:
          - errcheck
        path: cmd/
        text: SetSelectedTeamID
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
